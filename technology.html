<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technology | PhytoRevolution</title>
    <meta
      name="description"
      content="식물세포 유도·배양으로 고기능성 원료를 생산하는 파이토레볼루션의 독자 기술 PCAI"
    />

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/sub.css" />
    <link rel="stylesheet" href="css/renewal.css" />
    <link rel="stylesheet" href="css/refinement-v3.css" />
</head>
  <body data-page="services">
    <div id="site-header"></div>

    <main class="sub-main">
      <header class="service-band">
        <h1 class="reveal-title">Technology</h1>
        <p class="reveal">
          한국 자생식물의 가치를 PhytoRevolution의 기술로 다시 설계합니다
        </p>
      </header>

      <section class="service-intro">
        <h2 class="reveal-title">
          Plant Cell-Based Active Ingredient Technology
        </h2>
        <p class="reveal">
          희귀 식물자원에 의존하는 천연물 생산은 원료 확보와 지속가능성에 한계가
          있습니다.<br />
          PhytoRevolution은 <strong>PCAI 기술</strong>을 통해 식물자원의 채취를
          최소화하면서 <br />고기능성 활성소재를 안정적으로 생산할 수 있는
          새로운 천연물 생산 플랫폼을 구축합니다.
        </p>
      </section>

      <section class="service-steps">
        <img
          class="service-steps__image reveal"
          src="assets/images/pcait.webp"
          alt="PCAI 5단계 공정: Plant Resources, Cell & Tissue Culture, Scale-up Bioreactor, Bioactive Metabolites, Sustainable Applications"
        />
      </section>

      <section class="service-material">
        <div class="service-material__text">
          <p class="service-material__eyebrow reveal">Certifications</p>
          <h2 class="reveal-title">인증 및 지적재산권</h2>
        </div>

        <div class="service-material__gallery">
          <button
            type="button"
            class="service-material__item reveal"
            data-full="assets/images/cert-business.webp"
            data-caption="사업자등록증명"
          >
            <img src="assets/images/cert-business.webp" alt="사업자등록증명" />
            <span class="service-material__caption">사업자등록증명</span>
          </button>
          <button
            type="button"
            class="service-material__item reveal"
            data-full="assets/images/cert-patent1.webp"
            data-caption="출원사실증명원 ①"
          >
            <img
              src="assets/images/cert-patent1.webp"
              alt="특허출원사실증명원 1"
            />
            <span class="service-material__caption">출원사실증명원 ①</span>
          </button>
          <button
            type="button"
            class="service-material__item reveal"
            data-full="assets/images/cert-patent2.webp"
            data-caption="출원사실증명원 ②"
          >
            <img
              src="assets/images/cert-patent2.webp"
              alt="특허출원사실증명원 2"
            />
            <span class="service-material__caption">출원사실증명원 ②</span>
          </button>
        </div>
      </section>

      <div class="cert-lightbox" id="cert-lightbox" aria-hidden="true">
        <button
          type="button"
          class="cert-lightbox__close"
          id="cert-lightbox-close"
          aria-label="닫기"
        >
          ✕
        </button>
        <figure class="cert-lightbox__figure">
          <img id="cert-lightbox-img" src="" alt="" />
          <figcaption id="cert-lightbox-caption"></figcaption>
        </figure>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
